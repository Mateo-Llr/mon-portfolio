<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio de Mateo Leuillier, étudiant en BTS SIO SLAM et futur développeur informatique." />
    <title>Mateo Leuillier — Portfolio SLAM</title>
    <link rel="icon" href="assets/icon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bungee&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=editor-save-5" />
    <script>
      const resizeDesignCanvas = () => {
        const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
        document.documentElement.style.setProperty("--design-scale", scale.toString());
      };
      resizeDesignCanvas();
      window.addEventListener("resize", resizeDesignCanvas);
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="studio" id="top">
      <div class="room-model" id="roomModel" aria-hidden="true"></div>
      <div class="room-foreground" aria-hidden="true"></div>
      <div class="ambient-noise" aria-hidden="true"></div>
      <section class="scene" aria-label="Sélection de projets de Mateo Leuillier"></section>
      <div class="table-edge" aria-hidden="true"></div>

    </main>
    <aside class="project-sheet" id="projectSheet" aria-hidden="true" aria-labelledby="sheetTitle">
      <div class="sheet-backdrop" data-close-sheet></div>
      <div class="sheet-panel" role="dialog" aria-modal="true">
        <div class="sheet-toolbar">
          <span class="sheet-kicker" id="sheetKicker">ARCHIVE / 03</span>
          <button class="sheet-close" type="button" data-close-sheet aria-label="Fermer la fiche projet">FERMER <span>×</span></button>
        </div>
        <div class="sheet-body">
          <p class="sheet-index" id="sheetIndex">PROJECT 03</p>
          <h2 id="sheetTitle">SOULFRACT</h2>
          <p class="sheet-meta" id="sheetMeta"></p>
          <div class="sheet-project-meta" id="sheetProjectMeta"></div>
          <p class="sheet-lead" id="sheetLead"></p>
          <div class="sheet-rule"></div>
          <div class="sheet-content" id="sheetContent"></div>
        </div>
      </div>
    </aside>
    <aside class="trophy-panel" id="trophyPanel" aria-hidden="true" aria-labelledby="trophyPanelTitle">
      <div class="trophy-panel-inner">
        <div class="trophy-panel-header">
          <button class="trophy-panel-close" type="button" data-close-trophy aria-label="Fermer">FERMER <span>×</span></button>
        </div>

        <div class="trophy-panel-title-wrap">
          <h2 id="trophyPanelTitle">SCRATCH</h2>
        </div>

        <div class="trophy-panel-body">
          <p class="trophy-panel-description" id="trophyPanelDescription"></p>

          <div class="trophy-panel-meta-stack">
            <div class="trophy-panel-meta-line">
              <span class="trophy-panel-label">Catégorie</span>
              <span class="trophy-panel-value" id="trophyPanelMeta">PROGRAMMATION VISUELLE</span>
            </div>
            <div class="trophy-panel-meta-line">
              <span class="trophy-panel-label">Focus</span>
              <span class="trophy-panel-value">Apprentissage</span>
            </div>
            <div class="trophy-panel-meta-line">
              <span class="trophy-panel-label">Projet</span>
              <span class="trophy-panel-value">Soulfract</span>
            </div>
          </div>
        </div>
      </div>
    </aside>
    <script type="module" src="script.js?v=responsive-project-screen-17"></script>
  </body>
</html>
